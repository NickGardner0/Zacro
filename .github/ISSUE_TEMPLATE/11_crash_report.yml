name: Crash or hang
description: Report Zacro crashing, freezing, or failing to launch.
body:
  - type: textarea
    id: reproduction
    attributes:
      label: What happened?
      description: Include the steps before the crash or hang and whether it happens every time.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Commit and environment
      placeholder: Commit SHA, macOS version, Apple Silicon or Intel, debug or release build
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized crash or launch output
      description: Remove credentials and private account data. Do not post raw memory dumps publicly.

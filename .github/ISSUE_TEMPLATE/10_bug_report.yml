name: Bug report
description: Report a reproducible problem in Zacro.
body:
  - type: markdown
    attributes:
      value: Please check existing Zacro issues and remove private account data from attachments.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch Zacro
        2. Open ...
        3. Perform ...
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Describe the workflow and what happened. Include sanitized screenshots if useful.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Commit and environment
      placeholder: Commit SHA, macOS version, Apple Silicon or Intel, debug or release build
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant evidence
      description: Include sanitized logs, errors, or the Macro reference behavior, if applicable.

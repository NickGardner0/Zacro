body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What workflow in Zacro needs to improve, and why?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the smallest useful change and any relevant Macro reference behavior.
    validations:
      required: true
